<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemples pràctics · EAS CC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0f1117; --surface:#181c27; --surface-2:#1f2433; --surface-3:#262c3d;
  --border:#2b3142; --text:#e7eaf3; --muted:#8b93a7;
  --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14); --accent-2:#7aa9ff; --on-accent:#ffffff;
  --green:#3fb27f; --amber:#e0a23c; --violet:#a78bfa; --violet-soft:rgba(167,139,250,.15);
  --header-bg:rgba(15,17,23,.85); --glow:rgba(79,142,247,.10); --shadow:0 12px 40px -12px rgba(0,0,0,.6);
  --chip-ink:#111522;
  --radius:14px; --radius-sm:9px;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"DM Sans",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e4e9f2;
  --border:#d7dde8; --text:#1b2233; --muted:#5d6577;
  --accent:#2f6fd6; --accent-soft:rgba(47,111,214,.12); --accent-2:#2f6fd6; --on-accent:#ffffff;
  --violet:#6d4fd6; --violet-soft:rgba(109,79,214,.11);
  --header-bg:rgba(255,255,255,.88); --glow:rgba(79,142,247,.07); --shadow:0 12px 30px -14px rgba(20,30,60,.22);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e4e9f2;
  --border:#d7dde8; --text:#1b2233; --muted:#5d6577;
  --accent:#2f6fd6; --accent-soft:rgba(47,111,214,.12); --accent-2:#2f6fd6; --on-accent:#ffffff;
  --violet:#6d4fd6; --violet-soft:rgba(109,79,214,.11);
  --header-bg:rgba(255,255,255,.88); --glow:rgba(79,142,247,.07); --shadow:0 12px 30px -14px rgba(20,30,60,.22);
  color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand .dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f8ef7,#2f6fd6);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;font-size:13px;box-shadow:0 6px 18px -4px var(--accent)}
.brand h1{font-size:15px}
.nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.nav a{color:var(--muted);padding:9px 13px;border-radius:9px;font-size:13.5px;font-weight:500;text-decoration:none;transition:.15s}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.nav a.active{color:var(--accent-2);background:var(--accent-soft)}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px}
.modepill{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:var(--accent-soft);padding:3px 9px;border-radius:20px;border:0}

main{padding-block:24px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.panel h3{font-size:15px;margin-bottom:12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.page-title{font-size:22px}
.page-sub{color:var(--muted);font-size:14px}

/* Hero EAS */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.hero .txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h2{font-size:26px;line-height:1.15}
.hero p{color:var(--muted);font-size:14.5px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 11px;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.stat .k{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:7px}

/* Capacitats clau */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.capbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;transition:.12s}
.capbtn .sw{width:11px;height:11px;border-radius:3px;flex:none}
.capbtn .code{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--muted)}
.capbtn:hover{border-color:var(--muted)}
.capbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}

/* Mòduls */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.course{display:flex;flex-direction:column;gap:10px}
.course-h{display:flex;align-items:baseline;gap:10px}
.course-h h3{font-size:15px;margin:0}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px;text-decoration:none;transition:.14s;min-width:0}
.opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.opt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.opt .big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--accent-2);line-height:1.1}
.opt.mg .big{color:var(--violet)}
.opt .t{font-size:15px;font-weight:600}
.opt .d{font-size:12.5px;color:var(--muted)}
.opt .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.opt .foot b{font-family:var(--mono);color:var(--text);font-weight:600}
.opt.empty-mod{opacity:.62}
.opt.empty-mod:hover{opacity:1}
.kind{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.kind.mp{background:var(--accent-soft);color:var(--accent-2)}
.kind.mg{background:var(--violet-soft);color:var(--violet)}
.mps{display:flex;flex-wrap:wrap;gap:4px}
.mps span{font-family:var(--mono);font-size:11px;background:var(--surface-3);border-radius:5px;padding:1px 6px;color:var(--muted)}

.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:30px 20px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--text)}
.note{font-size:12.5px;color:var(--muted)}
.font{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
.font.doc{color:var(--green);border-color:var(--green)}
.font.prop{color:var(--amber);border-color:var(--amber)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;z-index:500;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:820px){.hero{grid-template-columns:1fr}}
@media (max-width:680px){
  header.top{padding-block:8px;gap:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .nav{order:3;width:100%;margin-left:0}
  .acts{grid-template-columns:1fr}
  .covlist{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#modview{--teal:#00A8B0;--dark:#00585E;--deep:#00434A;--light:#E6F6F7;--ink:#1F2A2E;--muted:#6B7C80;--accent:#00A8B0;--soft:#E6F6F7;--bg:#ECF2F3}
#modview *{box-sizing:border-box;margin:0;padding:0}
#modview button:focus-visible{outline:3px solid #F4A261;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#modview *{transition:none!important;animation:none!important}
}
#modview{height:100%;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#modview button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#modview svg{display:block}
#modview #home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:40px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--dark);color:#fff;overflow:auto}
#modview #home .brand{display:flex;align-items:center;gap:18px}
#modview #home .brand img{width:64px;background:#fff;border-radius:12px;padding:8px}
#modview #home h1{font-size:clamp(26px,4vw,44px);line-height:1.1}
#modview #home p.sub{color:#BFE8EB;font-size:clamp(15px,1.6vw,19px);margin-top:4px}
#modview .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,360px));max-width:1500px;gap:28px;justify-content:center;width:100%}
#modview .choice{background:#fff;color:var(--ink);border-radius:20px;padding:28px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#modview .choice:hover,#modview .choice:focus-visible{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.28);outline:none}
#modview .choice .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff}
#modview .choice h2{font-size:26px;color:var(--dark);line-height:1.15}
#modview .choice .act{font-size:16px;color:#6B7C80;font-weight:700}
#modview .choice .meta{display:flex;gap:8px;flex-wrap:wrap}
#modview .choice .meta span{background:var(--light);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--dark)}
#modview .choice .go{margin-top:6px;font-weight:700;color:var(--teal)}
#modview .groups{display:flex;flex-direction:column;gap:34px;width:100%;max-width:1500px}
#modview .grp .gt{font-size:clamp(20px,2.2vw,28px);color:#fff;display:flex;align-items:center;gap:12px}
#modview .grp .gt::before{content:"";width:14px;height:14px;border-radius:50%;background:#BFE8EB}
#modview .grp.alt{background:rgba(255,255,255,.08);border:2px dashed rgba(191,232,235,.6);border-radius:24px;padding:22px}
#modview .grp.alt .gt::before{background:#F4A261}
#modview .grp .gd{color:#BFE8EB;font-size:16px;margin:4px 0 16px}
#modview .grp .choices{justify-content:start;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
#modview .choice.mini{flex-direction:row;align-items:center;gap:16px;padding:18px 20px;align-self:center;background:rgba(255,255,255,.92);border:2px dashed #F4A261;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#modview .choice.mini .ic{width:48px;height:48px;font-size:22px;flex:none;background:#F4A261}
#modview .choice.mini h2{font-size:20px}
#modview .choice.mini p{font-size:14px;color:#6B7C80;font-weight:700}
#modview .choice.mini .go{margin-top:4px;font-size:15px}
#modview .choice.mini.on{background:#FDEBDA;border-style:solid}
#modview .grp[hidden]{display:none}
#modview #home .help{color:#BFE8EB;font-size:14px;text-align:center}
#modview #deck{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#modview #stagewrap{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
#modview #stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden}
#modview .slide{position:absolute;inset:0;padding:56px 80px 70px;display:flex;flex-direction:column}
#modview .slide.dark{background:var(--dark);color:#fff}
#modview .head{display:flex;justify-content:space-between;align-items:center;min-height:90px;gap:30px}
#modview .head h2{font-size:54px;color:var(--dark);line-height:1.05}
#modview .head img{height:80px}
#modview .chip{display:inline-flex;align-items:center;gap:10px;background:var(--soft);border-radius:99px;padding:8px 22px;font-weight:700;font-size:22px;margin-top:10px;align-self:flex-start}
#modview .foot{position:absolute;left:80px;right:80px;bottom:26px;display:flex;justify-content:space-between;color:var(--muted);font-size:17px}
#modview .dark .foot{color:#BFE8EB}
#modview .grid{display:grid;gap:28px;margin-top:30px;flex:1;align-content:start}
#modview .card{background:var(--light);border-radius:20px;padding:26px}
#modview .card .ic{width:62px;height:62px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:16px}
#modview .card h3{font-size:28px;color:var(--dark);margin-bottom:8px;line-height:1.15}
#modview .card p{font-size:23px;line-height:1.3}
#modview .grid.small .card{padding:20px}
#modview .grid.small .ic{width:50px;height:50px;font-size:22px;margin-bottom:10px}
#modview .grid.small h3{font-size:23px}
#modview .grid.small p{font-size:19px}
#modview .title-slide{justify-content:center}
#modview .title-slide .logo{position:absolute;left:80px;top:60px;background:#fff;border-radius:18px;padding:14px;width:140px}
#modview .title-slide h1{font-size:76px;line-height:1.05;max-width:1350px}
#modview .title-slide p{font-size:32px;color:#BFE8EB;margin-top:18px}
#modview .quote{background:var(--light);border-radius:24px;padding:50px 70px;font-size:40px;font-style:italic;font-weight:700;color:var(--dark);text-align:center;margin-top:30px;line-height:1.25}
#modview .sides{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
#modview .sides div{border-radius:20px;padding:26px 32px;font-size:24px}
#modview .sides div:first-child{background:#BFE8EB}
#modview .sides div:last-child{background:var(--soft)}
#modview .sides b{display:block;font-size:32px;color:var(--dark)}
#modview .rules{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
#modview .rule{display:flex;gap:22px;align-items:center;background:var(--light);border-radius:20px;padding:22px 26px}
#modview .rule .ic{flex:none;width:66px;height:66px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:30px}
#modview .rule b{display:block;font-size:27px;color:var(--dark)}
#modview .rule span{font-size:22px}
#modview .flow{display:flex;gap:16px;margin-top:40px;align-items:stretch}
#modview .flow .box{flex:1;border:2px solid var(--teal);border-radius:20px;padding:26px 14px;text-align:center;background:var(--light);display:flex;flex-direction:column;gap:12px;position:relative}
#modview .flow .box:nth-child(even){background:var(--soft)}
#modview .flow .box b{font-size:28px;color:var(--dark);line-height:1.15}
#modview .flow .box span{font-size:22px}
#modview .flow .box .t{font-size:46px;font-weight:700;color:var(--teal);margin-top:auto}
#modview .flowfoot{margin-top:30px;font-size:26px;font-style:italic;color:var(--dark)}
#modview .agenda{margin-top:30px;display:flex;flex-direction:column;gap:12px}
#modview .arow{display:grid;grid-template-columns:var(--tw,150px) 520px 1fr;align-items:center;gap:24px;font-size:26px;text-align:left;border-radius:12px;padding:4px 8px}
#modview .arow:hover{background:var(--light)}
#modview .arow .tm{color:var(--muted);font-weight:700}
#modview .arow .bar{height:40px;border-radius:10px;background:var(--dark);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;padding-left:12px;min-width:84px}

#modview .arow .nm b{color:var(--accent);filter:brightness(.85)}
#modview .total{margin-top:14px;font-style:italic;color:var(--muted);font-size:22px}
#modview .step{display:grid;grid-template-columns:1fr 540px;gap:44px;margin-top:20px;flex:1}
#modview .step>ul{list-style:none;display:flex;flex-direction:column;gap:20px;font-size:32px;line-height:1.25;margin-top:26px}
#modview .step>ul>li{display:flex;gap:18px}
#modview .step>ul>li::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:12px}
#modview .aside{background:var(--soft);border-radius:22px;padding:28px 32px}
#modview .aside h3{font-size:30px;color:var(--dark);margin-bottom:16px}

#modview .aside ul li::before{content:"·";font-weight:700;margin-right:10px;color:var(--dark)}
#modview .timer{display:flex;align-items:center;gap:16px;margin-top:10px}
#modview .timer .clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--light);color:var(--dark);border-radius:14px;padding:2px 22px;min-width:180px;text-align:center}
#modview .timer.warn .clock{background:#FDEBDA;color:#B45309}

@keyframes blink{50%{opacity:.55}}
#modview .timer button{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:22px}
#modview .timer button.sec{background:var(--light);color:var(--dark)}
#modview .timer .lbl{font-size:22px;font-weight:700;color:var(--muted)}
#modview .dots{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center;gap:12px}
#modview .dots span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;border:2px solid var(--teal);color:var(--dark)}
#modview .dots .done{background:var(--teal);color:#fff}
#modview .dots .cur{background:var(--accent);border-color:var(--accent);color:#fff}
#modview .qs{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px}
#modview .qs>div{background:var(--deep);border:2px solid var(--teal);border-radius:22px;padding:30px;font-size:34px;font-weight:700;line-height:1.2;min-height:300px}
#modview .qs .ic{width:66px;height:66px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:32px;margin-bottom:22px}
#modview .dark .head h2{color:#fff}
#modview #bar{display:flex;align-items:center;gap:10px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:#fff;border-top:1px solid #d5e2e4}
#modview #bar .t{font-weight:700;color:var(--dark);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modview #bar button{height:40px;min-width:40px;padding:0 12px;border-radius:10px;background:var(--light);color:var(--dark);display:inline-flex;align-items:center;gap:8px;font-weight:700}
#modview #bar button:hover{background:#cfeef0}
#modview #bar .num{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:center}
#modview #prog{height:5px;background:#d5e2e4}
#modview #prog div{height:100%;background:var(--accent);transition:width .2s}
#modview #notes{display:none;background:#FFF8E6;border-top:1px solid #f3dca6;padding:12px 18px;font-size:16px;line-height:1.4;max-height:28vh;overflow:auto}
#modview #notes b{color:#92400E}
#modview.shownotes #notes{display:block}
@media (max-width:640px){#modview #bar .lab{display:none}
}
#modview .imgbox{flex:1;display:grid;place-items:center;margin-top:20px}
#modview .imgbox img{max-width:100%;max-height:640px}

#modview{position:fixed;inset:0;z-index:100}
#modview .back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:15px}
#modview .back:hover{background:rgba(255,255,255,.22)}
#modview .propnote{display:inline-block;margin-top:10px;background:#FDEBDA;color:#9A4A0B;border-radius:99px;padding:4px 14px;font-size:14px;font-weight:700}
#modview .noacts{color:#BFE8EB;font-size:18px;text-align:center;max-width:520px}
#modview #home{padding-top:72px}
#modview .brand{color:#fff}
#modview .propnote[hidden]{display:none}
#modview .back{text-decoration:none}

body.inmod{overflow:hidden}
html,body{height:100%;overflow:hidden}
body{background:var(--bg)}
#closeBtn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:200;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;border:1.5px solid rgba(255,255,255,.22);border-radius:99px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#closeBtn:hover{background:rgba(0,0,0,.7)}
#modview{display:block!important}
</style>
